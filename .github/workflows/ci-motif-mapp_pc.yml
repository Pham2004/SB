name: LLM-AHD MOTIF - mapp_pc

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: 'Number of runs per problem (default: 3)'
        required: false
        default: '3'
        type: string

jobs:
  motif-mapp_pc:
    runs-on: ubuntu-latest
    timeout-minutes: 480

    steps:
      - name: Checkout SB repo
        uses: actions/checkout@v4

      - name: Checkout private RELIC repo
        uses: actions/checkout@v4
        with:
          repository: Pham2004/RELIC
          token: ${{ secrets.RELIC_TOKEN }}
          path: relic
          ref: main

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        working-directory: ./relic
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run MOTIF for mapp_pc
        working-directory: ./relic
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          iterations=${{ inputs.iterations || '3' }}
          for exp in $(seq 1 $iterations); do
            echo "=========================================="
            echo "Experiment $exp/$iterations: mapp_pc (MOTIF)"
            echo "=========================================="
            RUN_ID="exp$exp"
            python -m baselines.llm_ahd.hydra_run \
              method=motif \
              problem=mapp_pc \
              trainer.seed=0 \
              output.run_id="$RUN_ID"
            echo "Experiment $exp/$iterations completed"
            echo ""
          done

      - name: Upload all experiments for mapp_pc
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motif-mapp_pc-all
          path: |
            relic/baselines/llm_ahd/motif/results/mapp_pc/
          retention-days: 30
          if-no-files-found: warn

      - name: Display summary for mapp_pc
        if: always()
        working-directory: ./relic
        run: |
          iterations=${{ inputs.iterations || '3' }}
          for exp in $(seq 1 $iterations); do
            summary="baselines/llm_ahd/motif/results/mapp_pc/exp$exp/summary.json"
            if [ -f "$summary" ]; then
              echo "========== Summary Experiment $exp for mapp_pc =========="
              python -m json.tool < "$summary" | head -30
              echo ""
            else
              echo "No summary found for experiment $exp (may have been interrupted)"
            fi
          done

      - name: Display test results for mapp_pc
        if: always()
        working-directory: ./relic
        run: |
          iterations=${{ inputs.iterations || '3' }}
          for exp in $(seq 1 $iterations); do
            summary="baselines/llm_ahd/motif/results/mapp_pc/exp$exp/summary.json"
            echo "========== Test Results Experiment $exp for mapp_pc =========="
            if [ -f "$summary" ]; then
              python -c "import json; data = json.load(open('$summary')); print(json.dumps(data.get('test', {}), indent=2))"
            else
              echo "No summary found, skipping test results"
            fi
            echo ""
          done

      - name: Capture logs for mapp_pc (even if interrupted)
        if: always()
        working-directory: ./relic
        run: |
          iterations=${{ inputs.iterations || '3' }}
          for exp in $(seq 1 $iterations); do
            log_file="baselines/llm_ahd/motif/results/mapp_pc/exp$exp/run_log.jsonl"
            if [ -f "$log_file" ]; then
              log_count=$(wc -l < "$log_file")
              echo "Experiment $exp: captured $log_count log entries"
            else
              echo "Experiment $exp: no run log found (may not have started)"
            fi
          done
