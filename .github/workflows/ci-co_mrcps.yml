name: RELIC CO - co_mrcps

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: 'Number of runs per problem (default: 3)'
        required: false
        default: '3'
        type: string
      budget_per_batch:
        description: 'MCTS budget per batch (higher = better quality, slower)'
        required: false
        default: '10'
        type: string

jobs:
  relic-mas-parallel:
    runs-on: ubuntu-latest
    timeout-minutes: 480

    steps:
      - name: Checkout SB repo
        uses: actions/checkout@v4

      - name: Checkout private RELIC repo
        uses: actions/checkout@v4
        with:
          repository: Pham2004/RELIC
          token: ${{ secrets.RELIC_TOKEN }}
          path: relic
          ref: main

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        working-directory: ./relic
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run RELIC MAS for co_mrcps
        working-directory: ./relic
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          iterations=${{ inputs.iterations || '3' }}
          for exp in $(seq 1 $iterations); do
            echo "=========================================="
            echo "Experiment $exp/$iterations: co_mrcps"
            echo "Budget: ${{ inputs.budget_per_batch || '10' }} per batch"
            echo "=========================================="
            HYDRA_OUT_DIR="results/co_mrcps-exp$exp/relic"
            mkdir -p "$HYDRA_OUT_DIR"
            python main.py \
              problem=co_mrcps \
              framework.hyperparams.budget_per_batch=${{ inputs.budget_per_batch || '10' }} \
              path.RESULTS="$HYDRA_OUT_DIR"
            echo "Experiment $exp/$iterations completed"
            echo ""
          done

      - name: Run Tests for co_mrcps
        working-directory: ./relic
        run: |
          iterations=${{ inputs.iterations || '3' }}
          for exp in $(seq 1 $iterations); do
            RESULTS_DIR="results/co_mrcps-exp$exp/relic"
            PROBLEM_DIR="problems/co_mrcps"

            if [ ! -f "$RESULTS_DIR/func_A_best.py" ]; then
              echo "⚠️  Experiment $exp: No best code found, skipping tests"
              continue
            fi

            echo "=========================================="
            echo "Testing Experiment $exp: co_mrcps"
            echo "=========================================="

            # Copy best code to problem directory for eval.py to use
            cp "$RESULTS_DIR/func_A_best.py" "$PROBLEM_DIR/func_A.py"
            cp "$RESULTS_DIR/func_B_best.py" "$PROBLEM_DIR/func_B.py"
            cp "$RESULTS_DIR/func_C_best.py" "$PROBLEM_DIR/func_C.py"

            # Test n100
            echo "Running test on n100..."
            python "$PROBLEM_DIR/eval.py" \
              --data "co_mrcps_test_n100.npz" \
              > "$RESULTS_DIR/test_n100.txt" 2>&1

            # Test n200
            echo "Running test on n200..."
            python "$PROBLEM_DIR/eval.py" \
              --data "co_mrcps_test_n200.npz" \
              > "$RESULTS_DIR/test_n200.txt" 2>&1

            # Extract and display results
            echo ""
            echo "Test n100 Result:"
            tail -5 "$RESULTS_DIR/test_n100.txt" || echo "No result"
            echo ""
            echo "Test n200 Result:"
            tail -5 "$RESULTS_DIR/test_n200.txt" || echo "No result"
            echo ""
          done

      - name: Upload all experiments for co_mrcps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relic-mas-co_mrcps-all
          path: |
            relic/results/co_mrcps-exp*/relic/
            relic/outputs/
          retention-days: 30
          if-no-files-found: warn

      - name: Display summary for co_mrcps
        if: always()
        working-directory: ./relic
        run: |
          iterations=${{ inputs.iterations || '3' }}
          for exp in $(seq 1 $iterations); do
            summary="results/co_mrcps-exp$exp/relic/summary.json"
            if [ -f "$summary" ]; then
              echo "========== Summary Experiment $exp for co_mrcps =========="
              python -m json.tool < "$summary" | head -30
              echo ""
            else
              echo "⚠️  Experiment $exp: No summary found (may have been interrupted)"
            fi
          done

      - name: Display test results for co_mrcps
        if: always()
        working-directory: ./relic
        run: |
          iterations=${{ inputs.iterations || '3' }}
          for exp in $(seq 1 $iterations); do
            test_n100="results/co_mrcps-exp$exp/relic/test_n100.txt"
            test_n200="results/co_mrcps-exp$exp/relic/test_n200.txt"

            echo "========== Test Results Experiment $exp for co_mrcps =========="

            if [ -f "$test_n100" ]; then
              echo "--- Test N100 ---"
              cat "$test_n100"
            else
              echo "⚠️  No n100 test results"
            fi

            if [ -f "$test_n200" ]; then
              echo "--- Test N200 ---"
              cat "$test_n200"
            else
              echo "⚠️  No n200 test results"
            fi
            echo ""
          done

      - name: Capture logs for co_mrcps (even if interrupted)
        if: always()
        working-directory: ./relic
        run: |
          iterations=${{ inputs.iterations || '3' }}
          for exp in $(seq 1 $iterations); do
            log_file="results/co_mrcps-exp$exp/relic/run_log.jsonl"
            if [ -f "$log_file" ]; then
              log_count=$(wc -l < "$log_file")
              echo "✓ Experiment $exp: Captured $log_count log entries"
            else
              echo "⚠️  Experiment $exp: No run log found (may not have started)"
            fi
          done
